optimizer: {
  type: AdamW,
  kwargs: {
    lr: 0.001, 
    weight_decay: 0.0005
  }
}

scheduler: {
  type: LambdaLR,
  kwargs: {
    decay_step: 25,
    lr_decay: 0.771,
    lowest_decay: 0.001
  }
}

bnmscheduler: {
  type: Lambda,
  kwargs: {
    decay_step: 21,
    bn_decay: 0.5,
    bn_momentum: 0.9,
    lowest_decay: 0.01
  }
}

dataset: {
  train: { 
    _base_: cfgs/dataset_configs/ShapeNet-55.yaml,
    others: {subset: 'train'}
  },
  val: { 
    _base_: cfgs/dataset_configs/ShapeNet-55.yaml,
    others: {subset: 'test'}
  },
  test: { 
    _base_: cfgs/dataset_configs/ShapeNet-55.yaml,
    others: {subset: 'test'}
  }
}

model: {
  NAME: SeedFormer,
  feat_dim: 512,
  embed_dim: 128,
  n_knn: 20,
  l2_loss: 1
}

consider_metric: CDL2
total_bs: 8
step_per_update: 6
max_epoch: 200