optimizer: {
  type: AdamW,
  kwargs: {
    lr: 0.0001, 
    weight_decay: 0.0005
  }
}

scheduler: {
  type: LambdaLR,
  kwargs: {
    decay_step: 21,
    lr_decay: 0.63096,
    lowest_decay: 0.001
  }
}

bnmscheduler: {
  type: Lambda,
  kwargs: {
    decay_step: 21,
    bn_decay: 0.5,
    bn_momentum: 0.9,
    lowest_decay: 0.01
  }
}

dataset: {
  train: { 
    _base_: cfgs/dataset_configs/ShapeNet-55.yaml,
    others: {subset: 'train'}
  },
  val: { 
    _base_: cfgs/dataset_configs/ShapeNet-55.yaml,
    others: {subset: 'test'}
  },
  test: { 
    _base_: cfgs/dataset_configs/ShapeNet-55.yaml,
    others: {subset: 'test'}
  }
}

model: {
  NAME: DGTPNet,
  input_dim: 3,
  num_gaussians: 512,
  d_model: 512,
  nhead: 4,
  num_encoder_layers: 4,
  dim_feedforward: 1024,
  dropout: 0.1,
  num_refinement_layers: 2,
  k_neighbors: 20,
  num_coarse_points: 2048,
  num_fine_points: 8192,
  use_opacity_weighted_sampling: True,
  l2_loss: 1
}

consider_metric: CDL2
total_bs: 8
step_per_update: 2
max_epoch: 200